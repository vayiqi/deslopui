<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><style>
:root{color-scheme:dark}body{margin:0;color:#e8e6e1;font:16px system-ui,sans-serif}
.dim{color:#333}.half{opacity:.3}
.over{position:absolute;top:0;left:0;width:300px;height:100px;background:#fff}
.label{position:absolute;top:40px;left:10px;color:#ddd;pointer-events:none}
</style></head><body><p>Light text on a dark canvas</p><p class="dim">Dim text</p><p class="half">Faded by opacity</p>
<div style="position:relative;height:120px"><div class="over"></div><span class="label">Light on white sibling</span></div></body></html>
