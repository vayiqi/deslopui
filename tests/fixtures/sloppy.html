<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fafafa;color:#222;font:16px/1.5 system-ui,sans-serif}
.card{margin:16px;padding:16px;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.inner{padding:16px;border-radius:12px;background:#f2f2f2;box-shadow:0 1px 3px rgba(0,0,0,.1);height:60px}
.track{display:inline-flex;padding:4px;border-radius:999px;background:#e5e5e5;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.chip{padding:4px 12px;border-radius:999px;background:#333;color:#fafafa;height:24px;width:60px}
.stripe{border-left:4px solid #c00;padding:8px}
.rule{height:1px;background:#ddd;margin:8px 16px}
.faint{color:#bbb}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em}
a.small{display:inline-block;width:20px;height:20px}
.icons a{display:inline-block;width:16px;height:16px;margin-right:2px;background:#ddd}
</style></head><body>
<div class="card"><div class="inner">Nested</div>
<div class="track"><span class="chip">On</span></div>
<a href="#go" class="row">Open <button>Go</button></a>
</div>
<div class="stripe">Warning</div>
<div class="rule"></div>
<hr>
<p class="faint">Low contrast text</p>
<span class="tag">New</span>
<p>Paris · 14:02 · Raining</p>
<a class="small" href="#">x</a>
<div class="icons"><a href="#1"></a><a href="#2"></a><a href="#3"></a></div>
<p>Read the <a href="#">terms</a> before you start.</p>
<p style="background:url(data:image/gif;base64,R0lGODlhAQABAAAAACw=)">Over an image</p>
</body></html>
